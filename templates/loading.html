<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading — F1 Qualifying Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Jeko+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red: #e8001d;
            --black: #000000;
            --white: #ffffff;
            --grey-400: #9e9e9e;
            --grey-600: #424242;
            --grey-800: #121212;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        .label {
            font-family: 'Jeko Sans', 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 32px;
        }

        .race-name {
            font-family: 'Jeko Sans', 'Inter', sans-serif;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: var(--white);
            min-height: 2.8rem;
            margin-bottom: 40px;
        }

        /* Progress bar */
        .progress-track {
            width: 100%;
            height: 2px;
            background: var(--grey-800);
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--red);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Stages */
        .stages {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
        }
        .stage {
            flex: 1;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--grey-600);
            padding: 0 0 8px;
            border-bottom: 2px solid var(--grey-800);
            transition: color 0.2s, border-color 0.2s;
        }
        .stage.active {
            color: var(--white);
            border-bottom-color: var(--red);
        }
        .stage.done {
            color: var(--grey-600);
            border-bottom-color: var(--grey-600);
        }

        /* Status line */
        .status {
            font-size: 0.85rem;
            color: var(--grey-400);
            min-height: 1.4rem;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .skip-notice {
            font-size: 0.75rem;
            color: var(--grey-600);
            min-height: 1rem;
        }

        /* Spinner — minimal line ring */
        .spinner-wrap {
            margin: 40px 0 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ring {
            width: 18px;
            height: 18px;
            border: 2px solid var(--grey-800);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .spinner-label {
            font-size: 0.8rem;
            color: var(--grey-600);
        }

        .error-msg {
            display: none;
            margin-top: 24px;
            padding: 14px 16px;
            border: 1px solid var(--red);
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--red);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">Generating prediction</div>

        <div class="race-name" id="raceName">Initializing...</div>

        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="stages">
            <div class="stage" id="stage-loading">Loading</div>
            <div class="stage" id="stage-processing">Processing</div>
            <div class="stage" id="stage-training">Training</div>
            <div class="stage" id="stage-predicting">Predicting</div>
        </div>

        <div class="status" id="statusMessage">Initializing...</div>
        <div class="skip-notice" id="skipNotice"></div>

        <div class="spinner-wrap" id="spinnerWrap">
            <div class="ring" id="ring"></div>
            <span class="spinner-label" id="spinnerLabel">Working...</span>
        </div>

        <div class="error-msg" id="errorMessage"></div>
    </div>

    <script>
        // Clear any stale results from a previous run before starting a new one
        sessionStorage.removeItem('predictions');
        sessionStorage.removeItem('race_info');
        sessionStorage.removeItem('metrics');

        const eventSource = new EventSource('/predict_stream');
        const progressBar  = document.getElementById('progressBar');
        const raceName     = document.getElementById('raceName');
        const statusMsg    = document.getElementById('statusMessage');
        const skipNotice   = document.getElementById('skipNotice');
        const spinnerLabel = document.getElementById('spinnerLabel');
        const ring         = document.getElementById('ring');
        const errorMsg     = document.getElementById('errorMessage');

        let loadStep = 0;
        let totalSteps = 60;

        const STAGES = ['loading', 'processing', 'training', 'predicting'];

        function setStage(active) {
            STAGES.forEach(s => {
                const el = document.getElementById(`stage-${s}`);
                el.classList.remove('active', 'done');
                const idx = STAGES.indexOf(s);
                const activeIdx = STAGES.indexOf(active);
                if (idx < activeIdx) el.classList.add('done');
                else if (idx === activeIdx) el.classList.add('active');
            });
        }

        eventSource.onmessage = function(e) {
            const data = JSON.parse(e.data);

            switch (data.status) {
                case 'starting':
                    statusMsg.textContent = data.message;
                    progressBar.style.width = '3%';
                    spinnerLabel.textContent = 'Starting up...';
                    break;

                case 'loading':
                    loadStep++;
                    if (loadStep > totalSteps) totalSteps = loadStep + 10;
                    progressBar.style.width = Math.min((loadStep / totalSteps) * 60, 59) + '%';
                    statusMsg.textContent = data.message;
                    spinnerLabel.textContent = 'Fetching data...';
                    setStage('loading');
                    break;

                case 'processing': {
                    progressBar.style.width = '62%';
                    statusMsg.textContent = data.message;
                    spinnerLabel.textContent = 'Engineering features...';
                    setStage('processing');
                    const m = data.message.match(/(\d+) skipped/);
                    if (m) skipNotice.textContent = `${m[1]} rounds skipped`;
                    break;
                }

                case 'training':
                    progressBar.style.width = '75%';
                    statusMsg.textContent = data.message;
                    spinnerLabel.textContent = 'Training XGBoost...';
                    setStage('training');
                    break;

                case 'predicting': {
                    progressBar.style.width = '88%';
                    statusMsg.textContent = data.message;
                    spinnerLabel.textContent = 'Generating grid...';
                    setStage('predicting');
                    const rp = data.message.replace('Generating predictions for ', '').replace('...', '');
                    if (rp) raceName.textContent = rp;
                    break;
                }

                case 'complete':
                    progressBar.style.width = '100%';
                    ring.style.borderTopColor = '#fff';
                    statusMsg.textContent = 'Done';
                    spinnerLabel.textContent = 'Redirecting...';

                    sessionStorage.setItem('predictions', JSON.stringify(data.predictions));
                    sessionStorage.setItem('race_info', JSON.stringify(data.race_info));
                    sessionStorage.setItem('metrics', JSON.stringify(data.metrics || {}));

                    eventSource.close();
                    setTimeout(() => { window.location.href = '/results'; }, 800);
                    break;

                case 'error':
                    document.getElementById('spinnerWrap').style.display = 'none';
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    statusMsg.textContent = 'An error occurred';
                    eventSource.close();
                    break;
            }
        };

        eventSource.onerror = function() {
            document.getElementById('spinnerWrap').style.display = 'none';
            errorMsg.textContent = 'Connection lost. Please try again.';
            errorMsg.style.display = 'block';
            eventSource.close();
        };
    </script>
</body>
</html>
